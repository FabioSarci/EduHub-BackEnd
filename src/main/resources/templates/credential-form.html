<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Credential</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/2">
        <h2 class="text-2xl font-bold mb-4">Create New Credential</h2>
        <form th:action="${action}" th:method="${method}" th:object="${credential}">
            <!-- Se usi PUT, aggiungi questo hidden input -->
            <input type="hidden" name="_method" th:if="${method == 'put'}" value="put">
        
            <div class="mb-4">
                <label class="block text-gray-700">Email:</label>
                <input type="email" th:field="*{email}" class="w-full border p-2 rounded">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Password:</label>
                <input type="password" th:field="*{password}" class="w-full border p-2 rounded">
            </div>
            <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">
                Save
            </button>
        </form>
    </div>
</body>
</html>
