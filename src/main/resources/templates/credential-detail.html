<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credential Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/2">
        <h2 class="text-2xl font-bold mb-4">Credential Details</h2>
        <p><strong>ID:</strong> <span th:text="${credential?.id}"></span></p>
        <p><strong>Email:</strong> <span th:text="${credential?.email}"></span></p>
        <p><strong>Password:</strong> <span th:text="${credential?.password}"></span></p>
        <a href="/credential/list" class="mt-4 inline-block bg-blue-500 text-white px-4 py-2 rounded">Back to List</a>
    </div>
</body>
</html>
