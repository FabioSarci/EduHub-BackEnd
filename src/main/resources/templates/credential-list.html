<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credential List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center py-10">
    <h2 class="text-3xl font-bold mb-6">User Credentials</h2>

    <a href="/credential/index" class="mb-4 bg-blue-500 text-white px-4 py-2 rounded">Add New Credential</a>

    <table class="bg-white shadow-lg rounded-lg w-3/4">
        <thead>
            <tr class="bg-gray-300">
                <th class="p-4">ID</th>
                <th class="p-4">Email</th>
                <th class="p-4">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="credential : ${credentials}" class="border-b">
                <td class="p-4" th:text="${credential.id}"></td>
                <td class="p-4" th:text="${credential.email}"></td>
                <td class="p-4">
                    <a th:href="@{/credential/edit/{id}(id=${credential.id})}" class="bg-yellow-500 text-white px-4 py-2 rounded">Edit</a>
                    <a th:href="@{/credential/delete/{id}(id=${credential.id})}" class="bg-red-500 text-white px-4 py-2 rounded ml-2">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

    <script>
        // Salva il token JWT nel local storage
        const jwt = /*[[${token}]]*/ '';
        console.log(jwt);
        
        if (jwt) {
            localStorage.setItem('jwt', jwt);
        }

        // Aggiungi il token JWT come header di autorizzazione nelle richieste successive
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(event) {
                event.preventDefault();
                const url = new URL(this.href);
                const token = localStorage.getItem('jwt');
                if (token) {
                    fetch(url, {
                        method: 'GET',
                        headers: {
                            'Authorization': 'Bearer ' + token
                        }
                    })
                    .then(response => {
                        if (response.ok) {
                            window.location.href = url;
                        } else {
                            alert('Unauthorized');
                        }
                    })
                    .catch(error => console.error('Error:', error));
                } else {
                    alert('Token not found');
                }
            });
        });
    </script>
</body>
</html>
